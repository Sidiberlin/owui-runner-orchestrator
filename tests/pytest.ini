[pytest]
testpaths = unit integration
markers =
    integration: needs the live stack (docker compose + stub OWUI)
    slow: takes tens of seconds (idle sweeps, cache grace windows)
    devguard: runs against the LIVE devguard profile, not the isolated test
        stack; opt in with DEVGUARD_LIVE=1 (see test_package_seam.py)
addopts = -ra --strict-markers --timeout=300
