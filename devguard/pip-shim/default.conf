# PyPI index rewriter (ADR-0010).
#
# DevGuard serves PyPI's simple index verbatim: every link in it still points
# at https://files.pythonhosted.org/..., which a runner on an `internal: true`
# network cannot resolve. pip -- unlike npm, which rewrites the registry host
# itself -- follows those links literally, so the index resolves and then
# every download dies in DNS. DevGuard does expose a working
# /api/v1/dependency-proxy/pypi/packages/* route; the index simply never
# points at it. This rewrites the links onto that route.
#
# Everything still flows through devguard-api, so the malicious-package
# firewall applies to both the index and the download (verified: a flagged
# package returns 403 through this shim). This service has no upstream route
# of its own -- it is only on `runners` -- so it cannot reopen egress.

server {
  listen 8080;

  # Docker's embedded DNS. Without this nginx resolves devguard-api once at
  # startup and caches it forever, so the shim breaks when the API container
  # is recreated with a new IP.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $upstream http://devguard-api:8080;

  # Large indexes (requests is ~1MB of JSON) must not be truncated mid-rewrite.
  proxy_buffers 16 64k;
  proxy_buffer_size 64k;
  proxy_busy_buffers_size 128k;

  location / {
    proxy_pass $upstream;
    proxy_set_header Host $host;
    # sub_filter cannot rewrite a compressed body. Upstream must send plain
    # text, so strip the client's Accept-Encoding on the way out.
    proxy_set_header Accept-Encoding "";

    # BOTH of pip's content types, and this is the load-bearing detail:
    # pip negotiates application/vnd.pypi.simple.v1+json, NOT html. A curl
    # test gets html, sees a correctly rewritten index, and passes -- while
    # pip still fails, because its JSON went through unfiltered. Filtering
    # only html is the bug that looks like it works.
    sub_filter_types text/html
                     application/vnd.pypi.simple.v1+html
                     application/vnd.pypi.simple.v1+json
                     application/json;
    sub_filter_once off;
    # Hardcoded, not envsubst'd: nginx does not expand env vars in configs,
    # and the image's template mechanism would also eat nginx's own $host.
    # `pip-shim` is this service's network alias on `runners`, so runners
    # reach the rewritten URLs at exactly this name.
    sub_filter "https://files.pythonhosted.org/packages/"
               "http://pip-shim:8080/api/v1/dependency-proxy/pypi/packages/";
  }
}
