# =============================================================================
#  OWUI Agent Runner Orchestrator — Lane D
#  See REVIEW OUTCOMES v1.2 (N2, N4, N5) in the brief.
# =============================================================================
#
#  NETWORK TOPOLOGY (N2, updated by ADR-0006) — three networks, not one.
#
#    A socket proxy reachable by runners is worse than no socket proxy, so
#    `control` exists solely to keep docker-socket-proxy off `runners`.
#
#    Single-LXC consolidation (ADR-0006) put OWUI on this same host, so the
#    orchestrator joins OWUI's own docker network (`owui`, external) by name
#    instead of crossing the LAN — no bridge, no published port needed for
#    that hop (B1/Q1).
#
#        ┌────── owui (external, OWUI's network) ──┐
#        │                                          │
#        │              orchestrator                │
#        └──┬───────────────────┬──────────────────┘
#   control │                   │ runners
#  (internal)                   │ (internal: true, zero egress)
#           ▼                   ▼
#  ┌────────────────┐  ┌──────────────────────────────┐
#  │ socket-proxy   │  │ runner-<uid> … (created by    │
#  │ (docker API)   │  │ the orchestrator, NOT compose)│
#  └───────┬────────┘  └──────────────────────────────┘
#          │ /var/run/docker.sock
#          ▼  ** host root — see residual risks in v1.2 **
#
#  WHAT THIS FILE DOES NOT DO (Lane B owns these — see the v1.2 lane correction)
#    · per-user workspace volumes  — lazy, per-user, cannot be pre-declared here
#    · the quota layer (N4)
#    · per-runner key derivation (N1)
# =============================================================================

name: owui-runner

networks:
  control:
    driver: bridge
    internal: true
  # Open WebUI's own network. External: OWUI owns it, we join it. This is what
  # lets OWUI reach the orchestrator by name (http://orchestrator:8080) once
  # everything is consolidated onto one host (ADR-0006), with no LAN hop and
  # no published port.
  owui:
    external: true
    name: ${OWUI_NETWORK:-open-webui_default}

  # DevGuard's backing services. Internal: postgres/kratos/web have no reason
  # to reach the internet.
  devguard-internal:
    driver: bridge
    internal: true

  # The ONLY network in this file with upstream access. Exactly one service
  # joins it (devguard-api), which is what makes "runners reach pypi only
  # through a package firewall" a topology fact rather than a promise.
  devguard-egress:
    driver: bridge

  runners:
    driver: bridge
    internal: true
    # Explicit name: the orchestrator attaches runners to this network BY NAME
    # through the Docker API, so it must not depend on compose's project prefix.
    name: ${RUNNERS_NETWORK:-owui-runners-internal}

volumes:
  orch-state:
  devguard-pg:
  devguard-cache:
  # Scratch for `devguard-cli vulndb import`: the API image is distroless and
  # has no /tmp of its own, so the import dies with "stat /tmp: no such file
  # or directory". Upstream's chart mounts an 8Gi emptyDir here for the same
  # reason.
  devguard-vulndb-tmp:

services:

  # ---------------------------------------------------------------------------
  # Docker API broker (Q3 / N2).  The orchestrator never sees the raw socket.
  # NOTE: mounting the socket `:ro` does NOT make the Docker API read-only — it
  # only makes the bind mount read-only.  Write protection comes entirely from
  # the verb flags below.
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    networks: [control]           # deliberately NOT on `runners` (N2)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges
      # N5: this LXC host cannot load AppArmor profiles. Drop this line on a
      # host where `docker-default` loads normally.
      - apparmor=unconfined
    environment:
      # --- allowed: exactly what the orchestrator needs -----------------------
      POST: 1          # without this everything below is read-only
      CONTAINERS: 1    # create / start / stop / remove / inspect / list
      NETWORKS: 1      # attach runners to `runners`
      VOLUMES: 1       # per-user workspace volumes — omitting this 403s every
                       # first-time spawn (N2)
      IMAGES: 1        # startup image-existence check (R4)
      INFO: 1          # admission control reads real free memory (R3)
      PING: 1
      # --- denied ------------------------------------------------------------
      # MEASURED, not assumed: EXEC=0 returns 403 on POST /exec/{id}/start but
      # does NOT block POST /containers/{id}/exec (that is gated by CONTAINERS
      # and returns 201). An exec instance can be created but never started, so
      # exec is inert — just not blocked where you would expect.
      EXEC: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Same root-owned-volume problem as devguard-cache-init, applied to the
  # orchestrator's own state volume (ticket 12 review). The orchestrator has
  # no capabilities and never runs as root (unlike the runner, which starts
  # root and drops via gosu) - it cannot chown its own volume at startup, so
  # a one-shot init container does it instead, exactly once, before the
  # orchestrator is allowed to start. This is what actually survives a uid
  # change across image upgrades; baking a chown into the image only helps a
  # volume Docker creates empty and seeds from that exact image.
  # ---------------------------------------------------------------------------
  orchestrator-state-init:
    image: registry.opencode.de/oci-community/images/zendis/coreutils:main@sha256:4168c1bbcb59f61711cf1e5a99abdb9634b35a22d1db0f49f927daf87c812da8
    user: "0:0"
    volumes:
      - orch-state:/data
    command: ["sh", "-c", "chown -R 53111:53111 /data && chmod 0750 /data"]
    security_opt: [no-new-privileges, apparmor=unconfined]

  # ---------------------------------------------------------------------------
  # Orchestrator (Lane B builds the image this points at).
  # `docker compose config` validates now; `up` works once orchestrator/ exists.
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ./orchestrator
    image: owui-orchestrator:${ORCH_TAG:-dev}
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy   # avoids racing the R4 startup image check
      orchestrator-state-init:
        condition: service_completed_successfully
    networks: [owui, control, runners]
    ports:
      # Consolidated on one host, OWUI reaches us over the `owui` network by
      # name, so this publish is for local operators and the test suite only.
      # Default binds to loopback: nothing on the LAN needs it.
      - "${ORCH_BIND:-127.0.0.1}:${ORCH_PORT:-8080}:8080"
    volumes:
      # Orchestrator's own state (last-known workspace sizes for the N4 monitor).
      # NOT the users' data — the quota monitor reads usage through the runner's
      # own API rather than mounting everyone's files.
      #
      # A NAMED VOLUME, deliberately, not ./data. A host bind mount arrives
      # root-owned and the orchestrator runs as uid 53111 (ticket 12), so it
      # could not write its own cache: usage was forgotten on every restart
      # and the aggregate ceiling (R2) silently became unenforceable. Same
      # failure class as C5, except a bind mount gets no chown at all.
      # `orchestrator-state-init` below is what actually fixes ownership now
      # (ticket 12 review: the image only chowns /data at BUILD time, which
      # does nothing for a volume that already existed under the PREVIOUS
      # image's uid 10001 - a named volume is not re-seeded from the image
      # on every start, only when Docker creates it empty).
      - orch-state:/data
    security_opt:
      - no-new-privileges
      - apparmor=unconfined          # N5
    cap_drop: [ALL]
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375

      # --- auth (three distinct secrets — never reuse a value) ---------------
      ORCH_API_KEY:       ${ORCH_API_KEY:?set ORCH_API_KEY in .env}
      ORCH_MASTER_SECRET: ${ORCH_MASTER_SECRET:?set ORCH_MASTER_SECRET in .env}
      OWUI_BASE_URL:      ${OWUI_BASE_URL:?set OWUI_BASE_URL in .env}
      OWUI_ADMIN_TOKEN:   ${OWUI_ADMIN_TOKEN:?set OWUI_ADMIN_TOKEN in .env}

      # --- role mapper (A8: fail closed, bounded) ----------------------------
      ROLE_CACHE_TTL:   ${ROLE_CACHE_TTL:-60}
      ROLE_CACHE_GRACE: ${ROLE_CACHE_GRACE:-600}
      OWUI_API_TIMEOUT: ${OWUI_API_TIMEOUT:-5}

      # --- runner lifecycle ---------------------------------------------------
      RUNNER_IMAGE:    ${RUNNER_IMAGE:-owui-agent-runner:dev}
      RUNNERS_NETWORK: ${RUNNERS_NETWORK:-owui-runners-internal}
      RUNNER_CPUS:     ${RUNNER_CPUS:-1.5}
      RUNNER_MEMORY:   ${RUNNER_MEMORY:-1g}
      RUNNER_PIDS:     ${RUNNER_PIDS:-256}
      MAX_CONTAINERS:  ${MAX_CONTAINERS:-6}
      IDLE_TIMEOUT:    ${IDLE_TIMEOUT:-30m}

      # Runner security posture, as config so N5 is a one-line change when this
      # moves off LXC, and so N8's cap set is visible rather than buried in code.
      RUNNER_SECURITY_OPT: ${RUNNER_SECURITY_OPT:-no-new-privileges,apparmor=unconfined}
      RUNNER_CAP_ADD:      ${RUNNER_CAP_ADD:-CHOWN,DAC_OVERRIDE,FOWNER,SETUID,SETGID}

      # --- disk (N4: monitor-and-enforce; no kernel-level quota on this host) -
      RUNNER_DISK_SOFT:        ${RUNNER_DISK_SOFT:-5g}
      RUNNER_DISK_HARD:        ${RUNNER_DISK_HARD:-6g}
      WORKSPACE_TOTAL_CEILING: ${WORKSPACE_TOTAL_CEILING:-60g}
      DISK_POLL_INTERVAL:      ${DISK_POLL_INTERVAL:-60}
      # How often the idle sweep runs. Teardown latency is at worst
      # IDLE_TIMEOUT + this.
      IDLE_SWEEP_INTERVAL:     ${IDLE_SWEEP_INTERVAL:-30}
      # R2 retention. 0 = never delete (default). This destroys user data, so
      # it is opt-in.
      VOLUME_RETENTION_DAYS:     ${VOLUME_RETENTION_DAYS:-0}
      RETENTION_SWEEP_INTERVAL:  ${RETENTION_SWEEP_INTERVAL:-3600}

      # --- per-role policy (Lane C) -------------------------------------------
      # Default to the user limits, so "admin gets higher limits" is opt-in
      # rather than an accidental capacity hole. Admin runners still count
      # against MAX_CONTAINERS.
      ADMIN_RUNNER_CPUS:      ${ADMIN_RUNNER_CPUS:-}
      ADMIN_RUNNER_MEMORY:    ${ADMIN_RUNNER_MEMORY:-}
      ADMIN_RUNNER_DISK_SOFT: ${ADMIN_RUNNER_DISK_SOFT:-}
      # Q5 denylist. Everything not listed here is forwarded to the runner.
      PROXY_DENY_PREFIXES:    ${PROXY_DENY_PREFIXES:-/proxy,/ports,/api/terminals}
      # CSP injected on /files/serve responses. Agent-authored HTML is
      # otherwise executed in OWUI's own origin (verified live). Empty
      # disables the hardening.
      FILES_SERVE_CSP:        ${FILES_SERVE_CSP:-sandbox}

      # --- Open Terminal knobs pushed into each runner at create time (C6) ----
      OPEN_TERMINAL_MAX_SESSIONS:    ${OPEN_TERMINAL_MAX_SESSIONS:-8}
      OPEN_TERMINAL_EXECUTE_TIMEOUT: ${OPEN_TERMINAL_EXECUTE_TIMEOUT:-120}
      OPEN_TERMINAL_SESSION_CWD_TTL: ${OPEN_TERMINAL_SESSION_CWD_TTL:-604800}

      # --- future dependency proxy (empty default, no egress hole) ------------
      # --- Package Seam (ADR-0008) -------------------------------------------
      # Empty by default. DEVGUARD_ENABLED=true derives both from
      # DEVGUARD_BASE_URL; explicit values always win.
      DEVGUARD_ENABLED:    ${DEVGUARD_ENABLED:-false}
      DEVGUARD_BASE_URL:   ${DEVGUARD_BASE_URL:-http://devguard-api:8080}
      # pip alone routes via the shim (ADR-0010); npm goes straight to
      # DevGuard. Drop this once DevGuard rewrites the simple index itself.
      PIP_SHIM_BASE_URL:   ${PIP_SHIM_BASE_URL:-http://pip-shim:8080}
      PIP_INDEX_URL:       ${PIP_INDEX_URL:-}
      PIP_TRUSTED_HOST:    ${PIP_TRUSTED_HOST:-}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}

      # --- plumbing -----------------------------------------------------------
      # Headroom left free on the host AFTER admitting a runner (R3). Without
      # this passed through, the code default silently wins and the knob in
      # .env does nothing.
      MEMORY_RESERVE:     ${MEMORY_RESERVE:-512m}
      # Free-memory admission gate. OFF by default: inside Docker-on-LXC
      # /proc/meminfo is virtualised and under-reports by over a gigabyte, so
      # the gate refuses users while the host has plenty free. MAX_CONTAINERS x
      # RUNNER_MEMORY is the real, deterministic bound. Turn on only where
      # /proc/meminfo is accurate (a full VM).
      MEMORY_GATE:          ${MEMORY_GATE:-off}
      RUNNER_MEMORY_BUDGET: ${RUNNER_MEMORY_BUDGET:-}
      # Bumping this makes every existing runner reapable on the next
      # reconciliation - that is how you roll a new runner image (A4).
      RUNNER_VERSION:     ${RUNNER_VERSION:-1}
      # Daemon here reports MinAPIVersion 1.44; aiodocker's default is older
      # and gets rejected outright.
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-v1.44}
      LOG_LEVEL:          ${LOG_LEVEL:-INFO}

  # ---------------------------------------------------------------------------
  # Build-only helper: produces the runner image. Never started.
  #   docker compose --profile build build runner-image
  # Runners themselves are created by the orchestrator via the Docker API.
  # ---------------------------------------------------------------------------
  runner-image:
    profiles: ["build"]
    build:
      context: ./runner
      args:
        NODE_VERSION: ${NODE_VERSION:-22.14.0}
    image: ${RUNNER_IMAGE:-owui-agent-runner:dev}

  # ===========================================================================
  #  DevGuard platform (ADR-0007) — `--profile devguard`
  #
  #  Upstream ships no production compose: their docker-compose.yaml is
  #  dev-only (postgres + kratos + jaeger, no API, no web). These services are
  #  synthesised from the helm chart at appVersion v1.14.0, which is the real
  #  deployment artifact.
  #
  #  Only devguard-api touches `runners`, and only devguard-api touches
  #  `devguard-egress`. That single dual-homed service IS the chokepoint.
  # ===========================================================================

  devguard-postgres:
    profiles: ["devguard"]
    image: ghcr.io/l3montree-dev/devguard/postgresql:16.15
    restart: unless-stopped
    shm_size: 1g
    networks: [devguard-internal]
    environment:
      POSTGRES_USER: devguard
      POSTGRES_PASSWORD: ${DEVGUARD_DB_PASSWORD:?set DEVGUARD_DB_PASSWORD in .env}
      POSTGRES_DB: devguard
      KRATOS_DB_PASSWORD: ${DEVGUARD_DB_PASSWORD}
    volumes:
      - devguard-pg:/var/lib/postgresql/data
      # Upstream SQL mounted OUTSIDE the init dir so it is not also run
      # directly; init.sh runs it with the password substituted.
      - ./devguard/initdb.sql:/opt/devguard-initdb.sql:ro
      - ./devguard/initdb.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./devguard/healthcheck.sh:/opt/devguard-healthcheck.sh:ro
    tmpfs: /run/postgresql:rw,uid=999,gid=999
    security_opt: [no-new-privileges, apparmor=unconfined]
    # 512m OOM-kills postgres mid-import: the malicious-package feed can only
    # be loaded by `devguard-cli vulndb import`, which is all-or-nothing (the
    # --limitedToTables flag is plumbed through and then only logged -- it
    # filters nothing, in v1.14.0 or on main), so the whole vulndb lands:
    # ~13M cve_affected_component rows, 3.6GB of database. MEASURED: at 512m
    # the backend dies with "terminated by signal 9" partway through
    # insertStageIntoLive; at 4096m the import completes in 7m32s.
    # Upstream's chart asks for 8Gi limit / 2Gi request.
    mem_limit: ${DEVGUARD_PG_MEMORY:-4096m}
    healthcheck:
      # Not just pg_isready: initdb.sh once failed outright (no sed in this
      # image) and postgres still went healthy with no kratos database, so
      # every dependent service started and failed further downstream with a
      # confusing auth error. Healthy here means "initdb.sh actually finished".
      test: ["CMD", "bash", "/opt/devguard-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  devguard-kratos-migrate:
    profiles: ["devguard"]
    image: ghcr.io/l3montree-dev/devguard/kratos:v26.2.0
    networks: [devguard-internal]
    depends_on:
      devguard-postgres: {condition: service_healthy}
    environment:
      DSN: postgres://kratos:${DEVGUARD_DB_PASSWORD}@devguard-postgres:5432/kratos?sslmode=disable
    volumes: ["./devguard/kratos:/etc/config/kratos:ro"]
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    security_opt: [no-new-privileges, apparmor=unconfined]
    restart: on-failure

  devguard-kratos:
    profiles: ["devguard"]
    image: ghcr.io/l3montree-dev/devguard/kratos:v26.2.0
    restart: unless-stopped
    networks:
      devguard-internal: {aliases: [kratos]}
    depends_on:
      devguard-kratos-migrate: {condition: service_completed_successfully}
    environment:
      DSN: postgres://kratos:${DEVGUARD_DB_PASSWORD}@devguard-postgres:5432/kratos?sslmode=disable
      LOG_LEVEL: ${DEVGUARD_KRATOS_LOG_LEVEL:-warning}
    volumes: ["./devguard/kratos:/etc/config/kratos:ro"]
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    security_opt: [no-new-privileges, apparmor=unconfined]
    mem_limit: ${DEVGUARD_KRATOS_MEMORY:-256m}

  # ---------------------------------------------------------------------------
  # DevGuard's OWN schema. The API image does NOT self-migrate: it connects,
  # finds no `config`/`policies` tables, and panics
  # ("relation \"config\" does not exist"). In the helm chart these are the two
  # initContainers on the api deployment (templates/devguard/deployment.yaml at
  # appVersion v1.14.0), reproduced here as one-shot compose services.
  #
  # Do not merge them into one container: upstream runs them in order, and the
  # encryption pass needs the key mount that `migrate` deliberately does not get.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The cache volume arrives root-owned; devguard-api runs as uid 53111 and so
  # could not write it. MEASURED, not assumed: every dependency-proxy response
  # logged "Failed to cache response ... permission denied" and went upstream,
  # making ADR-0009's 2048MB cache a no-op. Upstream never hits this -- the helm
  # chart uses an emptyDir with fsGroup 2000, which k8s chowns for you.
  # ---------------------------------------------------------------------------
  devguard-cache-init:
    profiles: ["devguard"]
    # zendis/coreutils:main == BusyBox 1.37 (capability-verified, M0). `user:`
    # overrides the image's default USER=53111, same as the busybox it replaces.
    image: registry.opencode.de/oci-community/images/zendis/coreutils:main@sha256:4168c1bbcb59f61711cf1e5a99abdb9634b35a22d1db0f49f927daf87c812da8
    user: "0:0"
    volumes:
      - devguard-cache:/cache
    command: ["sh", "-c", "chown -R 53111:53111 /cache && chmod 0750 /cache"]
    security_opt: [no-new-privileges, apparmor=unconfined]

  devguard-migrate:
    profiles: ["devguard"]
    image: ghcr.io/l3montree-dev/devguard:${DEVGUARD_VERSION:-v1.14.0}
    networks: [devguard-internal]
    depends_on:
      devguard-postgres: {condition: service_healthy}
    environment:
      POSTGRES_HOST: devguard-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: devguard
      POSTGRES_PASSWORD: ${DEVGUARD_DB_PASSWORD}
      POSTGRES_DB: devguard
      FRONTEND_URL: ${DEVGUARD_FRONTEND_URL:-http://devguard-web:3000}
      GOMEMLIMIT: ${DEVGUARD_API_GOMEMLIMIT:-1024MiB}
      DEPENDENCY_PROXY_CACHE_MAX_SIZE_MB: ${DEVGUARD_PROXY_CACHE_MB:-2048}
    # No ENTRYPOINT in this image (Cmd is /bin/devguard), so `command` alone
    # swaps the server for the CLI, exactly as the chart's init container does.
    command: ["devguard-cli", "migrate"]
    security_opt: [no-new-privileges, apparmor=unconfined]
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Malicious-package feed import. NOT part of the `devguard` profile: it is a
  # maintenance job, run on demand and re-run periodically.
  #
  #   docker compose --profile devguard --profile devguard-import \
  #     run --rm devguard-vulndb-import
  #
  # Both profiles: devguard-postgres lives in the `devguard` one, and compose
  # refuses the project outright if a depends_on target is not selected.
  #
  # The dependency firewall checks a table; until this has run that table is
  # empty, and an empty table blocks nothing while looking exactly like a
  # working firewall from outside.
  #
  # Dual-homed deliberately: the database is on devguard-internal, the vulndb
  # artifact is pulled from an OCI registry, which needs devguard-egress.
  # ---------------------------------------------------------------------------
  # Same root-owned-volume problem as devguard-cache-init: the import runs as
  # uid 53111 and cannot write a fresh named volume.
  devguard-vulndb-tmp-init:
    profiles: ["devguard-import"]
    image: registry.opencode.de/oci-community/images/zendis/coreutils:main@sha256:4168c1bbcb59f61711cf1e5a99abdb9634b35a22d1db0f49f927daf87c812da8
    user: "0:0"
    volumes:
      - devguard-vulndb-tmp:/scratch
    command: ["sh", "-c", "chown -R 53111:53111 /scratch && chmod 0750 /scratch"]
    security_opt: [no-new-privileges, apparmor=unconfined]

  devguard-vulndb-import:
    profiles: ["devguard-import"]
    image: ghcr.io/l3montree-dev/devguard:${DEVGUARD_VERSION:-v1.14.0}
    networks: [devguard-internal, devguard-egress]
    depends_on:
      devguard-postgres: {condition: service_healthy}
      devguard-vulndb-tmp-init: {condition: service_completed_successfully}
    environment:
      POSTGRES_HOST: devguard-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: devguard
      POSTGRES_PASSWORD: ${DEVGUARD_DB_PASSWORD}
      POSTGRES_DB: devguard
      # Not optional: the CLI builds the full service graph before running the
      # import and panics with "FRONTEND_URL is not set" without it.
      FRONTEND_URL: ${DEVGUARD_FRONTEND_URL:-http://devguard-web:3000}
      GOMEMLIMIT: ${DEVGUARD_API_GOMEMLIMIT:-1024MiB}
    volumes:
      - devguard-vulndb-tmp:/tmp
    # --limitedToTables is NOT passed, because it does nothing: the flag is
    # plumbed from the CLI into ImportOptions and then only logged, in v1.14.0
    # and on main. The whole vulndb lands either way.
    command: ["devguard-cli", "vulndb", "import"]
    security_opt: [no-new-privileges, apparmor=unconfined]

  devguard-encryption-migration:
    profiles: ["devguard"]
    image: ghcr.io/l3montree-dev/devguard:${DEVGUARD_VERSION:-v1.14.0}
    networks: [devguard-internal]
    depends_on:
      devguard-migrate: {condition: service_completed_successfully}
    environment:
      POSTGRES_HOST: devguard-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: devguard
      POSTGRES_PASSWORD: ${DEVGUARD_DB_PASSWORD}
      POSTGRES_DB: devguard
      APP_SIDE_ENCRYPTION_KEY_PATH: /encryption/key
    volumes:
      - ./devguard/encryption-key:/encryption/key:ro
    command: ["devguard-cli", "encryption", "migration"]
    security_opt: [no-new-privileges, apparmor=unconfined]
    restart: on-failure

  devguard-api:
    profiles: ["devguard"]
    image: ghcr.io/l3montree-dev/devguard:${DEVGUARD_VERSION:-v1.14.0}
    restart: unless-stopped
    # THE chokepoint: reachable by runners, and the only thing with upstream.
    networks:
      runners: {aliases: [devguard-api]}
      devguard-internal: {}
      devguard-egress: {}
    depends_on:
      devguard-postgres: {condition: service_healthy}
      devguard-encryption-migration: {condition: service_completed_successfully}
      devguard-cache-init: {condition: service_completed_successfully}
      devguard-kratos: {condition: service_started}
    environment:
      POSTGRES_HOST: devguard-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: devguard
      POSTGRES_PASSWORD: ${DEVGUARD_DB_PASSWORD}
      POSTGRES_DB: devguard
      ORY_KRATOS_PUBLIC: http://kratos:4433
      ORY_KRATOS_ADMIN: http://kratos:4434
      INSTANCE_DOMAIN: ${DEVGUARD_INSTANCE_DOMAIN:-http://devguard-api:8080}
      FRONTEND_URL: ${DEVGUARD_FRONTEND_URL:-http://devguard-web:3000}
      API_URL: ${DEVGUARD_API_URL:-http://devguard-api:8080}
      # The dependency-proxy cache. Chart default is 4096; 2048 chosen here.
      # Without this, every URL DevGuard advertises for its own dependency
      # proxy points at api.main.devguard.org (the SaaS) -- see
      # controllers/dependencyfirewall/controller.go:214. Pin it to how the
      # runners actually reach us.
      DEPENDENCY_PROXY_BASE_URL: ${DEVGUARD_API_URL:-http://devguard-api:8080}/api/v1/dependency-proxy
      DEPENDENCY_PROXY_CACHE_DIR: /cache
      DEPENDENCY_PROXY_CACHE_MAX_SIZE_MB: ${DEVGUARD_PROXY_CACHE_MB:-2048}
      APP_SIDE_ENCRYPTION_KEY_PATH: /encryption/key
      GOMEMLIMIT: ${DEVGUARD_API_GOMEMLIMIT:-1024MiB}
      ENVIRONMENT: ${DEVGUARD_ENVIRONMENT:-prod}
    volumes:
      - devguard-cache:/cache
      - ./devguard/encryption-key:/encryption/key:ro
    security_opt: [no-new-privileges, apparmor=unconfined]
    mem_limit: ${DEVGUARD_API_MEMORY:-2048m}
    # NO healthcheck, deliberately. This image is distroless: no /bin/sh, no
    # wget, no curl -- MEASURED, the previous CMD-SHELL probe failed every
    # single time with 'stat /bin/sh: no such file or directory' and pinned the
    # service at "unhealthy" while it was serving 200s perfectly well. Docker
    # cannot probe a container from outside, so there is no in-container probe
    # to write. A permanently-red healthcheck trains operators to ignore
    # health, which is worse than having none.
    #   Liveness is checked from outside instead:
    #   curl http://devguard-api:8080/api/v1/health from the runners network.
    # (Upstream gets this for free: k8s httpGet probes need nothing in-image.)

  # ---------------------------------------------------------------------------
  # PyPI index rewriter (ADR-0010). See devguard/pip-shim/default.conf for why
  # this exists -- in short, npm rewrites the tarball host itself and pip does
  # not, so pip alone needs the index links pointed at DevGuard's own
  # pypi/packages route.
  #
  # Deliberately ONLY on `runners`: it has no upstream route, so it cannot
  # reopen egress, and DevGuard remains the only thing with one. All traffic
  # still passes through devguard-api, so the malicious-package firewall
  # applies unchanged.
  #
  # TEMPORARY. Delete this service, its config, and PIP_INDEX_URL's pip-shim
  # default the moment DevGuard rewrites the simple index itself.
  # ---------------------------------------------------------------------------
  pip-shim:
    profiles: ["devguard"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      runners: {aliases: [pip-shim]}
    depends_on:
      devguard-api: {condition: service_started}
    volumes:
      - ./devguard/pip-shim/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt: [no-new-privileges, apparmor=unconfined]
    mem_limit: ${PIP_SHIM_MEMORY:-64m}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  devguard-web:
    profiles: ["devguard"]
    image: ghcr.io/l3montree-dev/devguard-web:${DEVGUARD_VERSION:-v1.14.0}
    restart: unless-stopped
    # Internal-only by operator decision: no ports published. Reach it with
    # `docker compose exec` or a temporary port-forward when you need the UI.
    networks: [devguard-internal]
    depends_on:
      devguard-api: {condition: service_started}
    environment:
      DEVGUARD_API_URL: ${DEVGUARD_API_URL:-http://devguard-api:8080}
      NEXT_PUBLIC_API_URL: ${DEVGUARD_API_URL:-http://devguard-api:8080}
    security_opt: [no-new-privileges, apparmor=unconfined]
    mem_limit: ${DEVGUARD_WEB_MEMORY:-256m}
